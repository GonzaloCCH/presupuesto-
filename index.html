<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi presupuesto</title>
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#EEF3F1;--card:#FFFFFF;--ink:#13241E;--mut:#5E7068;--line:#D7E1DC;--acc:#0F766E;--accbg:#D5EEE9;--bad:#B84A12;--badbg:#F8E1D4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1815;--card:#16241F;--ink:#E6F0EC;--mut:#8DA39A;--line:#27382F;--acc:#4FD1C0;--accbg:#173A35;--bad:#F29B6B;--badbg:#3A2418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1815;--card:#16241F;--ink:#E6F0EC;--mut:#8DA39A;--line:#27382F;--acc:#4FD1C0;--accbg:#173A35;--bad:#F29B6B;--badbg:#3A2418;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
h1{font-size:20px;margin:0 0 10px;font-weight:800}
h2{font-size:15px;margin:0 0 10px;font-weight:600;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--bg);font-weight:600}
button.ghost{background:transparent;color:var(--mut);padding:4px 8px}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.ok{color:var(--acc)}.neg{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.mut{color:var(--mut);font-size:14px}
.bar{height:8px;border-radius:5px;background:var(--accbg);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--bad)}
.mov{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.mov:first-child{border-top:0}
.mov .t{flex:1;min-width:0}
.mov b{font-weight:600}
.amt{font-weight:600;white-space:nowrap}
.tag{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 2px;font-size:14px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accbg);color:var(--acc)}.chip.x{background:var(--badbg);color:var(--bad)}.chip.z{background:var(--bg);color:var(--mut);border:1px solid var(--line)}.sm{padding:6px 8px;font-size:14px}#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.on{opacity:1}textarea{font:13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;height:84px;margin-bottom:8px}.num{text-align:right;max-width:120px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav><div id="toast" role="status"></div>
<script>
var KEY="presupuesto-v2";
var CATS=["ALIMENTACIÓN","TRANSPORTE","VIVIENDA","SERVICIOS","SALUD","EDUCACIÓN","DEUDAS","AHORRO","ENTRETENIMIENTO","ROPA","FAMILIA","TARJETA","OTROS"];
var METS=["COOPE AHORRO","COOPE CREDITO","BANRURAL","ZIGI","EFECTIVO"];
var ENT=["ZIGI","COOPE DEBIT","COOPE CREDI","BANRURAL","EFECTIVO"];
var UBI=["JUACO","PERSONAL","BANCO","COOPERATIVA","AHORROS"];
var PAGO=["CRÉDITO","DÉBITO","EFECTIVO"];
function id(){return Math.random().toString(36).slice(2)}
function P(d,t,c,mo,p){return {id:id(),f:"2026-10-15",d:d,t:t,c:c,m:mo,p:p,k:"2026-10-1",n:""}}
function Sa(f,g,m,p,n){return {id:id(),f:f,g:g,m:m,p:p,n:n||""}}
function seed(){return {plan:[],ing:{},sal:[],cta:{"COOPE AHORRO":0,"COOPE CREDITO":0,"BANRURAL":0,"ZIGI":0,"EFECTIVO":0},acum:[],tc:0,deudas:[],fix:{sal:0,items:[]},vr:{sal:0,items:[]}}}
var S;
try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
var _n=new Date();var V={tab:"res",mes:_n.getFullYear()+"-"+("0"+(_n.getMonth()+1)).slice(-2),q:_n.getDate()<=15?1:2,met:"EFECTIVO",con:""};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return Number(n||0).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fd(s){return s?s.split("-").reverse().join("/"):""}
function key(){return V.mes+"-"+V.q}
function cur(){return S.plan.filter(function(x){return x.k===key()})}
function sum(a,k){return a.reduce(function(t,x){return t+Number(k?x[k]:x.m||0)},0)}
function opts(l,sel){return l.map(function(o){return "<option"+(o===sel?" selected":"")+">"+esc(o)+"</option>"}).join("")}
function ed(p,v,n){var a=p.split("."),o=S;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=n?(+v||0):v;save();draw()}
function del(l,i){S[l].splice(i,1);save();draw()}
function num(p,v){return '<input class="num" type="number" inputmode="decimal" step="0.01" value="'+v+'" onchange="ed(\''+p+'\',this.value,1)">'}
function val(i){var e=document.getElementById(i);return e?e.value.trim():""}
function today(){return new Date().toISOString().slice(0,10)}
function planTot(g){return sum(S.plan.filter(function(x){return x.d===g}))}
function conceptos(){var u=[];S.plan.forEach(function(x){if(u.indexOf(x.d)<0)u.push(x.d)});return u.sort()}
function head(){return '<div class="row" style="margin-bottom:12px"><input type="month" value="'+V.mes+'" onchange="V.mes=this.value||V.mes;draw()"><select onchange="V.q=+this.value;draw()"><option value="1"'+(V.q==1?" selected":"")+'>1ª quincena</option><option value="2"'+(V.q==2?" selected":"")+'>2ª quincena</option></select></div>'}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'}

function resumen(){
  var a=cur(),ing=S.ing[key()]||0,g=sum(a),s=Math.round((ing-g)*100)/100,h=head();
  h+='<div class="card"><div class="mut">Saldo de la quincena</div><div class="big '+(s<0?"neg":"ok")+'">'+f(s)+'</div><div class="kv" style="margin-top:12px"><span>Ingreso</span><input class="num" type="number" inputmode="decimal" step="0.01" value="'+ing+'" onchange="S.ing[key()]=+this.value||0;save();draw()"></div>'+kv("Gasto total",f(g))+kv("Salidas registradas (todas)",f(sum(S.sal)))+'</div>';
  var bc={},bt={FIJO:0,VARIABLE:0};
  a.forEach(function(x){bc[x.c]=(bc[x.c]||0)+Number(x.m);bt[x.t]=(bt[x.t]||0)+Number(x.m)});
  var cs=CATS.filter(function(c){return bc[c]}).sort(function(x,y){return bc[y]-bc[x]});
  h+='<div class="card"><h2>Total por categoría</h2>';
  if(!cs.length)h+='<div class="empty">Sin gastos presupuestados en esta quincena.</div>';
  cs.forEach(function(c){var p=g?bc[c]/g*100:0;h+='<div style="margin-bottom:10px"><div class="row"><span>'+esc(c)+'</span><span style="text-align:right"><b>'+f(bc[c])+'</b> <span class="tag">'+p.toFixed(0)+'%</span></span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'});
  return h+'</div><div class="card"><h2>Fijos y variables</h2>'+kv("Fijos",f(bt.FIJO))+kv("Variables",f(bt.VARIABLE))+'</div>'+historial()+respaldo();
}
function presup(){
  var a=cur(),h=head();
  h+='<div class="card"><h2>Nuevo gasto del presupuesto</h2><div class="grid"><input id="nd" list="cl" placeholder="Descripción"><input id="nm" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><datalist id="cl">'+conceptos().map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist>'
   +'<div class="grid"><select id="nc">'+opts(CATS,"OTROS")+'</select><select id="np">'+opts(METS,"EFECTIVO")+'</select></div><div class="grid"><select id="nt"><option>VARIABLE</option><option>FIJO</option></select><input id="nf" type="date" value="'+today()+'"></div><input id="nn" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addPlan()">Guardar gasto</button></div>';
  h+='<div class="card"><h2>Gastos presupuestados · '+f(sum(a))+'</h2>';
  if(!a.length)h+='<div class="empty">Sin gastos todavía.</div>';
  S.plan.forEach(function(x,i){if(x.k!==key())return;h+='<div class="mov"><div class="t"><b>'+esc(x.d)+'</b><div class="tag">'+fd(x.f)+' · '+esc(x.c)+' · '+esc(x.p)+' · '+esc(x.t)+(x.n?' · '+esc(x.n):'')+'</div></div><span class="amt">'+f(x.m)+'</span><button class="ghost" aria-label="Eliminar" onclick="del(\'plan\','+i+')">✕</button></div>'});
  var mm=a.filter(function(x){return x.p===V.met});
  h+='</div>'+copiar()+'<div class="card"><h2>Consulta por método de pago</h2><select onchange="V.met=this.value;draw()">'+opts(METS,V.met)+'</select>';
  METS.forEach(function(x){var t=a.filter(function(y){return y.p===x});h+='<div class="kv"><span>'+x+' <span class="tag">'+t.length+' mov.</span></span><b>'+f(sum(t))+'</b></div>'});
  h+='<h2 style="margin-top:14px">Gastos de '+esc(V.met)+' · '+f(sum(mm))+'</h2>';
  mm.forEach(function(x){h+='<div class="kv"><span>'+fd(x.f)+' '+esc(x.d)+'</span><b>'+f(x.m)+'</b></div>'});
  return h+'</div>';
}
function addPlan(){var d=val("nd").toUpperCase(),mo=parseFloat(val("nm"));if(!d||!(mo>0)){msg("Escribe una descripción y un monto mayor que 0.");return}
  S.plan.push({id:id(),f:val("nf"),d:d,t:val("nt"),c:val("nc"),m:mo,p:val("np"),k:key(),n:val("nn")});save();draw()}
function salidas(){
  var acc={},rows=S.sal.map(function(x,i){acc[x.g]=(acc[x.g]||0)+Number(x.m);var pr=planTot(x.g),so=pr-acc[x.g];return {x:x,i:i,pr:pr,ac:acc[x.g],so:so,es:pr===0?"SIN PRESUPUESTO":so<0?"EXCEDIDO":so===0?"AGOTADO":"DISPONIBLE"}});
  var pr=planTot(V.con),ut=sum(S.sal.filter(function(x){return x.g===V.con})),h='<h1>Control de salidas</h1>';
  h+='<div class="card"><h2>Consultar un rubro</h2><select onchange="V.con=this.value;draw()">'+opts(conceptos(),V.con)+'</select>'+kv("Presupuesto",f(pr))+kv("Utilizado",f(ut))+kv("Sobrante",'<span class="'+(pr-ut<0?"neg":"ok")+'">'+f(pr-ut)+'</span>')+'</div>';
  h+='<div class="card"><h2>Registrar salida</h2><div class="grid"><select id="sg">'+opts(conceptos(),V.con)+'</select><input id="sm" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><div class="grid"><select id="sp">'+opts(METS,"EFECTIVO")+'</select><input id="sf" type="date" value="'+today()+'"></div><input id="sn" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addSal()">Guardar salida</button></div>';
  h+='<div class="card"><h2>Salidas · '+f(sum(S.sal))+'</h2>';
  if(!rows.length)h+='<div class="empty">Aún no registras salidas.</div>';
  rows.slice().reverse().forEach(function(r){var x=r.x;h+='<div class="mov"><div class="t"><b>'+esc(x.g)+'</b> <span class="chip '+(r.es==="EXCEDIDO"?"x":r.es==="DISPONIBLE"?"":"z")+'">'+r.es.toLowerCase()+'</span><div class="tag">'+fd(x.f)+' · '+esc(x.p)+(x.n?' · '+esc(x.n):'')+'</div><div class="tag">Presup. '+f(r.pr)+' · acum. '+f(r.ac)+' · sobra '+f(r.so)+'</div></div><span class="amt">'+f(x.m)+'</span><button class="ghost" aria-label="Eliminar" onclick="del(\'sal\','+r.i+')">✕</button></div>'});
  return h+'<div class="kv"><span>Total salidas</span><b>'+f(sum(S.sal))+'</b></div></div>';
}
function addSal(){var mo=parseFloat(val("sm"));if(!(mo>0)){msg("Escribe un monto mayor que 0.");return}V.con=val("sg");S.sal.push({id:id(),f:val("sf"),g:val("sg"),m:mo,p:val("sp"),n:val("sn")});save();draw()}
function cuentas(){
  var gas={};S.sal.forEach(function(x){gas[x.p]=(gas[x.p]||0)+Number(x.m)});
  var ing=0,gs=0,h='<h1>Cuentas y deudas</h1><div class="card"><h2>Ingresos y gastados por cuenta</h2>';
  METS.forEach(function(c){ing+=S.cta[c];gs+=gas[c]||0;h+='<div class="kv"><span>'+c+'<div class="tag">gastado '+f(gas[c]||0)+(c==="COOPE CREDITO"?" · deuda de tarjeta":"")+'</div></span>'+num("cta."+c,S.cta[c])+'</div>'});
  h+=kv("Totales",f(ing)+' / '+f(gs))+'</div>';
  function ac(k){return sum(S.acum.filter(function(x){return x.u.indexOf(k)>=0}))}
  var ent=[["COOPE",S.cta["COOPE AHORRO"]+S.cta["COOPE CREDITO"]+ac("COOPE")],["BANRURAL",S.cta.BANRURAL+ac("BANRURAL")],["ZIGI",S.cta.ZIGI+ac("ZIGI")],["EFECTIVO",S.cta.EFECTIVO+ac("EFECTIVO")]];
  h+='<div class="card"><h2>Saldos totales por entidad</h2>';ent.forEach(function(e){h+=kv(e[0],f(e[1]))});
  h+='</div><div class="card"><h2>Acumulados</h2>';
  S.acum.forEach(function(x,i){h+='<div class="mov"><div class="t"><b>'+esc(x.d)+'</b><div class="tag">'+fd(x.f)+' · '+esc(x.u)+'</div></div><span class="amt">'+f(x.m)+'</span><button class="ghost" aria-label="Eliminar" onclick="del(\'acum\','+i+')">✕</button></div>'});
  h+=kv("Total",f(sum(S.acum)))+'<div class="grid" style="margin-top:10px"><input id="ad" placeholder="Descripción"><input id="am" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><div class="grid"><select id="au">'+opts(ENT,"EFECTIVO")+'</select><input id="af" type="date" value="'+today()+'"></div><button style="width:100%" onclick="addAcum()">Agregar acumulado</button></div>';
  var deu=gas["COOPE CREDITO"]||0;
  h+='<div class="card"><h2>Tarjeta de crédito</h2><div class="kv"><span>Límite</span>'+num("tc",S.tc)+'</div>'+kv("Deuda actual",f(deu))+kv("Disponible",'<span class="ok">'+f(S.tc-deu)+'</span>')+'</div>';
  var tot=sum(S.deudas,"m"),pag=sum(S.deudas,"c");
  h+='<div class="card"><h2>Deudas / crédito · restante '+f(tot-pag)+'</h2>';
  S.deudas.forEach(function(d,i){var p=d.m?Math.min(100,d.c/d.m*100):0,re=d.m-d.c;
    h+='<div style="margin-bottom:14px"><div class="row"><b>'+esc(d.d)+'</b><span style="text-align:right">restan <b class="'+(re>0?"neg":"ok")+'">'+f(re)+'</b></span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="tag" style="margin:4px 0">'+(d.f?fd(d.f)+' · ':'')+esc(d.u)+' · total '+f(d.m)+(d.n?' · '+esc(d.n):'')+'</div><div class="row"><span class="mut">Cancelado</span>'+num("deudas."+i+".c",d.c)+'</div><div class="row" style="margin-top:6px"><span class="mut">Fecha cancelado</span><input type="date" value="'+d.fc+'" onchange="ed(\'deudas.'+i+'.fc\',this.value)"><button class="ghost" onclick="del(\'deudas\','+i+')">Quitar</button></div></div>'});
  h+=kv("Totales",f(tot)+' / '+f(pag)+' / '+f(tot-pag))+'<div class="grid" style="margin-top:10px"><input id="dn" placeholder="Descripción"><input id="dm" type="number" inputmode="decimal" placeholder="Monto"></div><div class="grid"><select id="du">'+opts(UBI,"PERSONAL")+'</select><input id="df" type="date" value="'+today()+'"></div><input id="dt" placeholder="Notas (opcional)" style="margin-bottom:8px"><button style="width:100%" onclick="addDeuda()">Agregar deuda</button></div>';
  return h;
}
function addAcum(){var m=parseFloat(val("am"));if(!val("ad")||isNaN(m)){msg("Escribe descripción y monto.");return}S.acum.push({id:id(),f:val("af"),d:val("ad").toUpperCase(),m:m,u:val("au")});save();draw()}
function addDeuda(){var m=parseFloat(val("dm"));if(!val("dn")||!(m>0)){msg("Escribe descripción y un monto mayor que 0.");return}S.deudas.push({id:id(),f:val("df"),d:val("dn").toUpperCase(),m:m,c:0,fc:"",u:val("du"),n:val("dt")});save();draw()}
function plant(k,title){
  var o=S[k],tot=sum(o.items),h='<div class="card"><h2>'+title+'</h2><div class="kv"><span>Salario</span>'+num(k+".sal",o.sal)+'</div>';
  o.items.forEach(function(x,i){h+='<div class="mov"><div class="t"><b>'+esc(x.d)+'</b><div class="tag">'+(esc(x.p)||"sin método")+'</div></div><span class="amt">'+f(x.m)+'</span><button class="ghost" aria-label="Eliminar" onclick="S.'+k+'.items.splice('+i+',1);save();draw()">✕</button></div>'});
  h+=kv("Total",f(tot))+kv("Saldo",'<span class="'+(o.sal-tot<0?"neg":"ok")+'">'+f(o.sal-tot)+'</span>')+'<h2 style="margin-top:12px">Por método de pago</h2>';
  PAGO.forEach(function(p){var t=o.items.filter(function(x){return x.p===p});h+='<div class="kv"><span>'+p+' <span class="tag">'+t.length+' mov.</span></span><b>'+f(sum(t))+'</b></div>'});
  h+='<div class="grid" style="margin-top:10px"><input id="'+k+'d" placeholder="Descripción"><input id="'+k+'m" type="number" inputmode="decimal" step="0.01" placeholder="Monto"></div><select id="'+k+'p" style="margin-bottom:8px"><option value="">Sin método</option>'+opts(PAGO,"DÉBITO")+'</select><button style="width:100%" onclick="addPl(\''+k+'\')">Agregar</button></div>';
  return h;
}
function addPl(k){var m=parseFloat(val(k+"m")),d=val(k+"d").toUpperCase();if(!d||!(m>0)){msg("Escribe descripción y un monto mayor que 0.");return}S[k].items.push({d:d,m:m,p:val(k+"p")});save();draw()}
function plantillas(){
  var all=S.fix.items.concat(S.vr.items),h='<h1>Gastos fijos y variables</h1>'+plant("fix","Gastos fijos")+plant("vr","Gastos variables");
  h+='<div class="card"><h2>Total general por método</h2>';
  PAGO.forEach(function(p){var t=all.filter(function(x){return x.p===p});h+='<div class="kv"><span>'+p+' <span class="tag">'+t.length+' mov.</span></span><b>'+f(sum(t))+'</b></div>'});
  var c=all.filter(function(x){return PAGO.indexOf(x.p)>=0});
  return h+kv("Total general",f(sum(c)))+'</div>';
}
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function msg(t){var e=document.getElementById("toast");e.textContent=t;e.className="on";clearTimeout(msg.t);msg.t=setTimeout(function(){e.className=""},2800)}
function nom(k){var a=k.split("-");return MES[+a[1]-1]+" "+a[0]+" · "+(a[2]==1?"1ª":"2ª")+" quincena"}
function historial(){
  var u={};S.plan.forEach(function(x){u[x.k]=1});Object.keys(S.ing).forEach(function(k){if(S.ing[k])u[k]=1});
  var ks=Object.keys(u).sort().reverse(),h='<div class="card"><h2>Quincenas guardadas</h2><div class="tag" style="margin-bottom:6px">Todo se guarda solo en la app. Toca una quincena para consultarla.</div>';
  ks.forEach(function(k){var g=sum(S.plan.filter(function(x){return x.k===k})),i=S.ing[k]||0,sa=Math.round((i-g)*100)/100;
    h+='<div class="mov"><div class="t"><b>'+nom(k)+'</b>'+(k===key()?' <span class="chip">viendo</span>':'')+'<div class="tag">Ingreso '+f(i)+' · gasto '+f(g)+' · saldo '+f(sa)+'</div></div><button class="ghost" onclick="go(\''+k+'\')">Ver</button></div>'});
  return h+'</div>';
}
function go(k){var a=k.split("-");V.mes=a[0]+"-"+a[1];V.q=+a[2];draw();window.scrollTo(0,0)}
function copiar(){
  var m=V.mes,q=2;if(V.q==2){var a=V.mes.split("-"),y=+a[0],n=+a[1]+1;if(n>12){n=1;y++}m=y+"-"+("0"+n).slice(-2);q=1}
  return '<div class="card"><h2>Copiar esta quincena a otra</h2><div class="tag" style="margin-bottom:8px">Copia los gastos y el ingreso (si el destino no tiene) para no empezar de cero.</div><div class="row" style="margin-bottom:8px"><input id="cm" type="month" value="'+m+'"><select id="cq"><option value="1"'+(q==1?" selected":"")+'>1ª quincena</option><option value="2"'+(q==2?" selected":"")+'>2ª quincena</option></select></div><button style="width:100%" onclick="doCopy()">Copiar gastos</button></div>';
}
function doCopy(){
  var m=val("cm"),q=+val("cq");if(!m){msg("Elige el mes de destino.");return}
  var k=m+"-"+q,src=cur();
  if(k===key()){msg("Elige otra quincena como destino.");return}
  if(!src.length){msg("Esta quincena no tiene gastos para copiar.");return}
  var d=m+(q==1?"-01":"-16");
  src.forEach(function(x){S.plan.push({id:id(),f:d,d:x.d,t:x.t,c:x.c,m:x.m,p:x.p,k:k,n:x.n})});
  if(!S.ing[k])S.ing[k]=S.ing[key()]||0;
  save();V.mes=m;V.q=q;draw();msg("Copiados "+src.length+" gastos a "+nom(k));
}
function copyText(t,ok){
  function fb(){var e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();try{document.execCommand("copy");msg(ok)}catch(x){msg("No se pudo copiar. Selecciona el texto y cópialo.")}document.body.removeChild(e)}
  try{navigator.clipboard.writeText(t).then(function(){msg(ok)},fb)}catch(e){fb()}
}
function respaldo(){
  return '<div class="card"><h2>Respaldo y exportar</h2><div class="tag" style="margin-bottom:8px">Copia tus datos para guardarlos en Notas o en un archivo. Para Excel, pega los gastos en una hoja.</div><button style="width:100%;margin-bottom:8px" onclick="copyText(JSON.stringify(S),\'Respaldo copiado\')">Copiar respaldo completo</button><button style="width:100%;margin-bottom:12px" onclick="copyTsv()">Copiar gastos para Excel</button><textarea id="rs" placeholder="Pega aquí un respaldo para restaurarlo"></textarea><button class="ghost" style="width:100%;border:1px solid var(--line)" onclick="restaurar()">Restaurar respaldo (reemplaza todo)</button></div>';
}
function copyTsv(){
  var rows=[["Quincena","Fecha","Descripción","Tipo","Categoría","Monto","Método","Notas"]].concat(S.plan.slice().sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:0}).map(function(x){return [nom(x.k),fd(x.f),x.d,x.t,x.c,String(x.m).replace(".",","),x.p,x.n||""]}));
  copyText(rows.map(function(r){return r.join("\t")}).join("\n"),"Gastos copiados. Pégalos en Excel");
}
function restaurar(){
  var t=val("rs");if(!t){msg("Pega primero el respaldo.");return}
  try{var o=JSON.parse(t);if(!o.plan||!o.sal||!o.cta||!o.fix)throw 0;S=o;save();draw();msg("Respaldo restaurado")}catch(e){msg("Ese texto no es un respaldo válido.")}
}
function draw(){
  var T={res:resumen,pre:presup,sal:salidas,cue:cuentas,pla:plantillas};
  document.getElementById("app").innerHTML=T[V.tab]();
  document.getElementById("nav").innerHTML=[["res","Resumen"],["pre","Presup."],["sal","Salidas"],["cue","Cuentas"],["pla","Fijos"]].map(function(t){return '<button class="'+(V.tab===t[0]?"on":"")+'" onclick="V.tab=\''+t[0]+'\';draw();window.scrollTo(0,0)">'+t[1]+'</button>'}).join("");
}
draw();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
